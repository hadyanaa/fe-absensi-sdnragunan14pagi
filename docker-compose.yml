services:
  web-absensi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.sdnragunan14pagi.sch.id/api
    container_name: web-absensi-app
    restart: unless-stopped
    ports:
      - "3000:80" # Port luar 3000 diarahkan ke Nginx port 80 di dalam container

